name: CI

# Two builds, then the tests, on macOS, Linux and Windows:
#
#   1. bff as an IMP module      -- one custom `imp` package with this
#      checkout overlaid at `modules/bff`
#   2. bff as a standalone pip   -- the wheels of the IMP-free core (`bff`,
#      package                      import name IMP.bff)
#
# Both carry a test stage: the custom IMP package against the fast tier, the
# wheel through cibuildwheel's test-command.

on:
  push:
    # Only the integration branches build on push: independent-core reaches
    # CI as a push to dev in the same breath (the same commit), so a push
    # trigger on '**' built everything twice. Other branches enter through
    # a PR to dev/main or a manual dispatch.
    branches: [dev, main]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR. Without this every push queues a fresh copy of the
# whole matrix behind the last one, and a fix waits on results nobody wants
# any more. main and tags are exempt: a release build has to finish even if
# another push lands while it runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── Decide how much of the matrix this run earns ──────────────────────────
  #
  # A feature branch gets one fast Linux leg per build. dev, main, releases
  # and manual runs get the full three-platform matrix -- that is where
  # "builds on all platforms" actually has to hold, not on every WIP push.
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.check.outputs.lane }}
      os_matrix: ${{ steps.check.outputs.os_matrix }}
      wheel_matrix: ${{ steps.check.outputs.wheel_matrix }}
    steps:
      - id: check
        run: |
          BRANCH="${{ github.ref }}"
          if [[ "$BRANCH" == "refs/heads/main" || "$BRANCH" == "refs/heads/dev" || \
                "$BRANCH" == refs/tags/* || \
                "${{ github.event_name }}" == "release" || \
                "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "lane=full" >> "$GITHUB_OUTPUT"
            echo 'os_matrix={"os":["ubuntu-latest","macos-14","windows-latest"]}' >> "$GITHUB_OUTPUT"
            echo 'wheel_matrix={"include":[{"os":"ubuntu-latest","arch":"x86_64"},{"os":"macos-14","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"},{"os":"windows-2022","arch":"AMD64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "lane=fast" >> "$GITHUB_OUTPUT"
            echo 'os_matrix={"os":["ubuntu-latest"]}' >> "$GITHUB_OUTPUT"
            echo 'wheel_matrix={"include":[{"os":"ubuntu-latest","arch":"x86_64"}]}' >> "$GITHUB_OUTPUT"
          fi

  # ── 1. bff as an in-tree IMP module ──────────────────────────────────────
  imp_module:
    name: IMP module (${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      # Stop the matrix early when one OS lane fails, so CI time is not
      # spent on likely-redundant builds.
      fail-fast: true
      matrix: ${{ fromJson(needs.setup.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: false

      - name: Cache conda packages
        id: get-date
        run: echo "week=$(/bin/date -u '+%Y-%U')" >> "$GITHUB_OUTPUT"
        shell: bash
      # continue-on-error: caching is an optimization, not a correctness
      # requirement -- a cache-service hiccup (or, under `act` locally, a
      # known image gap -- nektos/act#107) must not fail the build.
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.CONDA }}/pkgs
          key: conda-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conda-recipe/imp/**') }}-${{ steps.get-date.outputs.week }}
          restore-keys: |
            conda-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conda-recipe/imp/**') }}-
            conda-pkgs-${{ runner.os }}-${{ runner.arch }}-

      # sccache caches object files across runs (via the GitHub Actions cache
      # backend), so only what actually changed since the last run on this OS
      # recompiles. build.sh/bld.bat pass the launcher flags only when a
      # `sccache` binary is on PATH, so a machine without this action set up
      # still builds fine, just without the speedup.
      - uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
      - name: Enable sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"

      # Windows uses the standalone binary because its shell launcher is not
      # reliable. Unix runners use the package installed in the test prefix.
      - name: Install rattler-build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "v0.76.0"
          $url = "https://github.com/prefix-dev/rattler-build/releases/download/$tag/rattler-build-x86_64-pc-windows-msvc.zip"
          $dest = "$env:RUNNER_TEMP\rattler-build"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$dest\rattler-build.zip"
          Expand-Archive -Path "$dest\rattler-build.zip" -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter rattler-build.exe |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Host "::error::the rattler-build zip holds no rattler-build.exe"
            Get-ChildItem -Path $dest -Recurse | Select-Object FullName
            exit 1
          }
          echo "RATTLER_BUILD_EXE=$($exe -replace '\\','/')" >> $env:GITHUB_ENV
      - name: Install rattler-build (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash -e {0}
        run: |
          "$CONDA/bin/conda" install -y -n test rattler-build

      # ── custom IMP with this checkout at modules/bff ───────────────────────
      # The recipe unpacks IMP, overlays this checkout at modules/bff, and
      # configures the root IMP project once. Installing its output therefore
      # installs IMP.bff beside the matching IMP libraries and SWIG fragments.
      # The completed artifact is cached separately from conda packages and
      # sccache objects. An exact hit skips rattler-build entirely; a failed
      # build is never saved, so a partial output cannot poison a later run.
      - name: Restore the custom IMP+BFF package
        id: imp-package-cache
        uses: actions/cache/restore@v4
        with:
          path: imp-bld
          key: custom-imp-bff-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conda-recipe/imp/**', 'CMakeLists.txt', 'Headers.cmake', 'src/**', 'include/**', 'pyext/**', 'thirdparty/ptolib/**', 'data/**', 'examples/**', 'bin/**', 'cmake/**') }}
      - name: Build our imp
        if: steps.imp-package-cache.outputs.cache-hit != 'true'
        shell: bash -e {0}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            builder="$RATTLER_BUILD_EXE"
          else
            builder="$CONDA/envs/test/bin/rattler-build"
          fi
          if [ ! -x "$builder" ]; then
            echo "::error::rattler-build is unavailable at $builder"
            exit 1
          fi
          "$builder" --version
          "$builder" build --recipe conda-recipe/imp/recipe.yaml \
              --env-isolation none \
              --channel conda-forge --output-dir imp-bld
      - name: Save the custom IMP+BFF package
        if: steps.imp-package-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: imp-bld
          key: custom-imp-bff-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conda-recipe/imp/**', 'CMakeLists.txt', 'Headers.cmake', 'src/**', 'include/**', 'pyext/**', 'thirdparty/ptolib/**', 'data/**', 'examples/**', 'bin/**', 'cmake/**') }}
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats

      - name: Install the custom IMP module build into a test env
        shell: bash -e {0}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            conda_exe="$CONDA/Scripts/conda.exe"
          else
            conda_exe=conda
          fi
          for attempt in 1 2 3; do
            "$conda_exe" create -y -n bff-test --strict-channel-priority \
              -c ./imp-bld -c conda-forge \
              imp pytest pooch ihm scipy && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "retrying test env creation (attempt $attempt failed)"
            sleep 10
          done

      # Only test_*.py is the maintained fast integration gate. medium_test_*.py
      # records longer validation experiments with separate inputs and pins;
      # it must not turn a package smoke test into an unrelated API migration.
      - name: Run fast tests
        shell: bash -e {0}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            conda_exe="$CONDA/Scripts/conda.exe"
          else
            conda_exe=conda
          fi
          # Keep test discovery and execution in the same interpreter invocation
          # to avoid shell-feature differences across runners.
          "$conda_exe" run -n bff-test --no-capture-output python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          # Our imp's compiled-in data/example paths do not survive rattler's
          # prefix relocation; set these first (IMP checks here first).
          conda_prefix = os.environ["CONDA_PREFIX"]
          os.environ["IMP_DATA"] = str(Path(conda_prefix) / "share" / "IMP")
          # IMP module lookup expects each example root to contain bff/.
          # The checkout is flat, so make that module layout in the ephemeral
          # workspace while still importing the installed custom IMP package.
          fixture_root = Path.cwd() / ".ci-bff-examples"
          shutil.rmtree(fixture_root, ignore_errors=True)
          fixture_bff = fixture_root / "bff"
          fixture_root.mkdir()
          try:
              fixture_bff.symlink_to(Path.cwd() / "examples", target_is_directory=True)
          except OSError:
              shutil.copytree(Path.cwd() / "examples", fixture_bff)
          os.environ["IMP_EXAMPLE_DATA"] = str(fixture_root)

          tests = sorted(
              str(p) for p in Path("test").rglob("*.py")
              if p.name.startswith("test_")
          )
          if not tests:
              print("No matching fast tests found under test/")
              sys.exit(0)

          print(f"{len(tests)} test files selected")
          sys.exit(
              subprocess.call([sys.executable, "-m", "pytest", *tests, "-v"])
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: custom-imp-with-bff-${{ matrix.os }}
          path: imp-bld/**/*.conda
          if-no-files-found: error

  # ── 2. bff as a standalone pip package: the IMP-free core, as wheels ──────
  #
  # Built from standalone/CMakeLists.txt under scikit-build-core via
  # cibuildwheel; the config lives in [tool.cibuildwheel] in pyproject.toml.
  # Import name IMP.bff, get_build() == 'core'; the wheel's own test-command
  # is the test stage.
  pip_wheel:
    name: Wheel (${{ matrix.os }}, ${{ matrix.arch }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      # Stop the wheel matrix early when one OS/arch lane fails.
      fail-fast: true
      matrix: ${{ fromJson(needs.setup.outputs.wheel_matrix) }}
    # sccache, via the same GitHub Actions cache backend the conda builds
    # use; the compiler launchers that switch it on live in pyproject.toml's
    # [tool.cibuildwheel.*.environment] tables -- setting them here through
    # CIBW_ENVIRONMENT_* would replace those tables wholesale (tttrlib's
    # measured lesson). The sccache action's ACTIONS_CACHE_URL and
    # ACTIONS_RUNTIME_TOKEN are inherited from the job by the cibuildwheel
    # subprocesses. SCCACHE_IDLE_TIMEOUT=0 keeps the server alive for the
    # whole job: it otherwise exits after 600 s idle and takes the counters
    # with it, so a build followed by tests reports "0 compile requests"
    # while the cache was in fact hitting.
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools_scm reads the tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Windows: MSVC on PATH, Boost and Eigen from vcpkg, cereal headers
      #    from the repo's own script. Everything the core needs is
      #    header-only, so the wheel links nothing outside itself.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      # actions/cache's `path` is evaluated from the `env` context, which
      # holds only what a workflow, job or step declared -- not the runner
      # image's own environment. VCPKG_INSTALLATION_ROOT is the latter, so
      # it goes to GITHUB_ENV first (tttrlib's pattern).
      - name: Resolve the vcpkg root into the env context
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT_RESOLVED=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Cache vcpkg Boost and Eigen
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT_RESOLVED }}\installed
          key: vcpkg-bff-x64-windows-${{ runner.os }}-v2
      - name: Install Boost and Eigen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Header-only ports of exactly what the core includes
          # (boost/random, boost/range, boost/math for i0's exact Bessel
          # function). vcpkg's network installs fail transiently often
          # enough to warrant the retry.
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            & $vcpkg install boost-random boost-range boost-math eigen3:x64-windows --recurse --no-print-usage
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { exit 1 }
            Write-Host "vcpkg install failed (attempt $i of $attempts); retrying in 90 s"
            Start-Sleep -Seconds 90
          }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          # vcpkg's status database is inside installed/, so a partially
          # restored cache reports "already installed" and the failure
          # surfaces much later as a configure error with nothing pointing
          # back here. The eigen3 port keeps the headers under include/eigen3.
          foreach ($f in @("include\boost\version.hpp", "include\boost\math\special_functions\bessel.hpp", "include\eigen3\Eigen\Dense", "share\eigen3\Eigen3Config.cmake")) {
            if (-not (Test-Path "$root\$f")) {
              Write-Host "::error::vcpkg reported success but $root\$f is missing."
              Write-Host "The cached vcpkg tree is incomplete. Bump the key"
              Write-Host "suffix (vcpkg-bff-...-v1) to force a clean rebuild."
              exit 1
            }
          }
          echo "VCPKG_PREFIX=$root" >> $env:GITHUB_ENV
      - name: Fetch cereal headers (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash utility/wheel_deps.sh "$USERPROFILE/imp-bff-deps"

      - name: Build the wheels
        run: |
          python -m pip install cibuildwheel==2.23.3
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ── Publish the wheels to PyPI on a published GitHub Release ──────────────
  #
  # Trusted publishing: the PyPI project `imp-bff` must list this workflow as a
  # publisher (owner's step on pypi.org) before the first release runs this.
  publish_wheels:
    name: Publish wheels to PyPI
    needs: pip_wheel
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── Documentation ─────────────────────────────────────────────────────────
  #
  # Modelled on tttrlib's `build_docs`: build the HTML, keep it as an artifact
  # on every run, and publish it to gh-pages in versioned directories with a
  # landing page that lets a reader switch versions.
  #
  # This job does NOT build IMP.bff, and that is deliberate. doc/ contains no
  # `automodule`/`autoclass`/`autofunction` directive anywhere -- the C++ API
  # is generated by Doxygen from the headers, and every narrative page is a
  # hand-written .rst or a notebook with its outputs stored in the repository.
  # The only thing `import IMP.bff` ever provided to conf.py was the version
  # string, which now comes from IMP_BFF_DOCS_VERSION. Compiling the module
  # (SWIG + the whole core, the better part of a quarter of an hour) would
  # therefore add nothing to the rendered pages. conf.py falls back to
  # `autodoc_mock_imports` if a directive is ever added, so that stays a
  # warning rather than a wall.
  #
  # For the same reason it does not wait for the build jobs: nothing in the
  # pages is produced by the compiled library, so a red matrix cannot make
  # the published documentation wrong, and a docs-only push gets its answer
  # in minutes instead of after the full three-platform matrix.
  #
  # Notebook and gallery execution is off (IMP_BFF_DOCS_EXECUTE_EXAMPLES=0,
  # the conf.py default): those pages need the compiled module, several
  # gigabytes of structure and photon data and, in a few cases, the network.
  # Set the variable to 1 for a local build if you want the figures recomputed.
  build_docs:
    name: Build Documentation
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      # peaceiris/actions-gh-pages pushes to the gh-pages branch.
      contents: write
    env:
      IMP_BFF_DOCS_EXECUTE_EXAMPLES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-selector step reads the versions.json already on
          # gh-pages, so the checkout needs the remote's other branches.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # pandoc: nbsphinx converts the notebooks with it.
          # doxygen/graphviz: the C++ API pages and their diagrams.
          sudo apt-get install -y --no-install-recommends pandoc doxygen graphviz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install the documentation toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r doc/requirements.txt

      - name: Set documentation version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "DOCS_VERSION=${VERSION}" >> "$GITHUB_ENV"
            echo "DOCS_LABEL=IMP.bff ${VERSION}" >> "$GITHUB_ENV"
            echo "DOCS_IS_STABLE=true" >> "$GITHUB_ENV"
            echo "DOCS_DEPLOY_STABLE=true" >> "$GITHUB_ENV"
          else
            # `main` does not exist in this repository; dev is the only
            # integration branch, so it is what "development" points at.
            echo "DOCS_VERSION=dev" >> "$GITHUB_ENV"
            echo "DOCS_LABEL=development" >> "$GITHUB_ENV"
            echo "DOCS_IS_STABLE=false" >> "$GITHUB_ENV"
            echo "DOCS_DEPLOY_STABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Build the documentation
        env:
          # conf.py reads this when IMP.bff is not importable, which here it
          # never is.
          IMP_BFF_DOCS_VERSION: ${{ env.DOCS_VERSION }}
        run: |
          set -euo pipefail
          # -T: full traceback on an extension error, so a failure here is
          # readable from the log alone.
          python -m sphinx -b html -T -d doc/_build/doctrees -j auto \
            doc doc/_build/html/stable 2>&1 | tee doc/sphinx_build.log
          # doc/Doxyfile writes straight into _build/html/stable/api, so it
          # runs after Sphinx (which does not remove directories it does not
          # own) rather than being copied in afterwards.
          (cd doc && doxygen)
          test -f doc/_build/html/stable/index.html
          test -f doc/_build/html/stable/api/index.html

      - name: Prepare the documentation version selector
        shell: bash
        run: |
          # No `-u`: an empty VERSION_ARGS array expanded under `set -u` is an
          # error on bash < 4.4, and this should not depend on the runner
          # image's bash.
          set -eo pipefail
          mkdir -p doc/_build/pages-root
          cp -r doc/static_root/. doc/_build/pages-root/
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          EXISTING=
          if git show origin/gh-pages:versions.json > /tmp/imp-bff-versions.json 2>/dev/null; then
            EXISTING=/tmp/imp-bff-versions.json
          fi
          VERSION_ARGS=()
          if [ -n "$EXISTING" ]; then
            VERSION_ARGS+=(--existing "$EXISTING")
          fi
          if [ "$DOCS_IS_STABLE" = "true" ]; then
            VERSION_ARGS+=(--stable)
          fi
          python utility/update_docs_versions.py \
            "${VERSION_ARGS[@]}" \
            --output doc/_build/pages-root/versions.json \
            --version "$DOCS_VERSION" \
            --label "$DOCS_LABEL" \
            --url "$DOCS_VERSION/index.html"
          cat doc/_build/pages-root/versions.json

      # Always, including on pull requests: a reviewer can download the pages
      # a change produces without anything being published.
      - uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: doc/_build/html/stable
          if-no-files-found: error

      - name: Upload the Sphinx build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-build-log
          path: doc/sphinx_build.log
          if-no-files-found: ignore

      # ── Deploy: releases and dev pushes only ────────────────────────────
      #
      # peaceiris/actions-gh-pages@v4 rather than tttrlib's @v3: identical
      # inputs, but v3 still runs on the retired node16 runtime.
      - name: Deploy release documentation version
        if: github.event_name == 'release'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html/stable
          keep_files: true
          destination_dir: ${{ env.DOCS_VERSION }}

      - name: Deploy stable documentation
        if: env.DOCS_DEPLOY_STABLE == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html/stable
          keep_files: true
          destination_dir: stable

      - name: Deploy dev documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html/stable
          keep_files: true
          destination_dir: dev

      - name: Deploy the documentation version selector
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/pages-root
          keep_files: true
          destination_dir: .
